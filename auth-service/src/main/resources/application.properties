# ========================
# SERVER
# ========================
server.port=${PORT:8081}
spring.application.name=auth-service

# ========================
# DATABASE
# ========================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vouch_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:bully}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========================
# JWT
# ========================
jwt.secret=${JWT_SECRET}
jwt.expiration=2592000000

# ========================
# MAIL (password reset OTP, registration OTP, welcome email)
# ========================
# Sent via Brevo's HTTP API, not raw SMTP — Railway blocks outbound SMTP
# (ports 465/587) on non-Pro plans, but a normal HTTPS request is unaffected.
# brevo.from-email must be a Sender verified in the Brevo dashboard.
brevo.api-key=${BREVO_API_KEY:}
brevo.from-email=${BREVO_FROM_EMAIL:vouchg78@gmail.com}
