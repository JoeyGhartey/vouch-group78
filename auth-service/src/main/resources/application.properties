# ========================
# SERVER
# ========================
server.port=${PORT:8081}
spring.application.name=auth-service

# ========================
# DATABASE
# ========================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vouch_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:bully}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========================
# JWT
# ========================
jwt.secret=${JWT_SECRET:vouch-super-secret-key-that-should-be-at-least-256-bits-long-for-security-purposes-change-this-in-production}
jwt.expiration=2592000000

# ========================
# MAIL (password reset OTP, email identifier only)
# ========================
# Default host/port target Gmail's SMTP relay. Set MAIL_USERNAME to a Gmail
# address and MAIL_PASSWORD to a 16-character Gmail App Password (Google
# Account > Security > 2-Step Verification > App Passwords) — not the normal
# account password. Any other SMTP provider works too, just override the host/port.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
