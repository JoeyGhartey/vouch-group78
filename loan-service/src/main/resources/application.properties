# ========================
# SERVER
# ========================
server.port=${PORT:8083}
spring.application.name=loan-service

# ========================
# DATABASE
# ========================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vouch_loans}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:bully}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========================
# JWT
# ========================
jwt.secret=${JWT_SECRET}

# ========================
# SERVICE URLS
# ========================
services.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}
services.expense-service.url=${EXPENSE_SERVICE_URL:http://localhost:8086}
